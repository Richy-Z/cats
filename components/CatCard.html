<!DOCTYPE html>
<html>

<head></head>

<body>
	<div class="cat-card">
		<img sklair-attr-src="url" sklair-attr-alt="alt">

		<div class="actions">
			<a class="edit-btn" aria-label="Edit image">
				<i class="fas fa-pen" aria-hidden="true"></i>
			</a>

			<a class="download-btn" sklair-attr-href="url" download aria-label="Download image">
				<i class="fas fa-download" aria-hidden="true"></i>
			</a>

			<button class="copy-btn" type="button" aria-label="Copy image link">
				<i class="fas fa-link" aria-hidden="true"></i>
			</button>
		</div>
	</div>
</body>

</html>
